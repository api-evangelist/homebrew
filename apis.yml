aid: homebrew
name: Homebrew
description: >-
  Homebrew is a San Francisco-based seed-stage venture capital firm founded in 2013 by Hunter Walk
  (a former product leader at Google and YouTube) and Satya Patel (a former VP of Product at Twitter,
  partner at Battery Ventures, and product leader at Google). Named after the Homebrew Computer Club,
  the firm practices high-conviction, concentrated seed investing, taking board-level positions and
  acting as an extension of the founder's team. Roughly 90% of its investments are pre-seed and seed,
  with initial checks in the $100K-$500K range and the ability to follow on up to $25M+ in later rounds.
  Homebrew backs mission-driven founders working on large, urgent, and valuable problems across fintech,
  AI/ML, healthcare, climate, defense, logistics, real estate, and consumer, focused on companies
  operating in the Americas. After a decade of institutional funds that backed companies such as Chime,
  Plaid, Gusto, and Mercury, Homebrew announced in 2021 that it would stop raising outside LP capital and
  invest only its own money going forward under the banner "Homebrew Forever."
